name: Deploy GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths:
      - "docs/**"
      - "demo_data.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed (Req 7.6)
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

# Default minimal permissions (Req 7.2)
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: docs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python validators
        run: pip install pyyaml jsonschema

      - name: Copy demo data into docs
        run: |
          mkdir -p docs/assets/data
          cp demo_data.json docs/assets/data/demo_data.json

      - name: Validate frontmatter
        run: python docs/tools/check_frontmatter.py docs

      - name: Validate screenshots
        run: python docs/tools/check_screenshots.py docs
        continue-on-error: true # PNG screenshots may not be present yet; warn but do not block

      - name: Validate demo data schema
        run: python docs/tools/validate_demo_schema.py docs/assets/data/demo_data.json docs/_data/demo_schema.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site on first run if Settings → Pages
          # has not been configured manually yet (avoids the "Get Pages
          # site failed" 404 from configure-pages).
          enablement: true

      - name: Build with Jekyll
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --strict_front_matter \
            --trace \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ../_site

      - name: HTMLProofer
        working-directory: docs
        run: |
          bundle exec htmlproofer ../_site \
            --disable-external \
            --no-enforce-https \
            --allow-missing-href \
            --ignore-missing-alt
        continue-on-error: true # Some optional internal references may not yet resolve

      - name: Verify sitemap
        run: |
          if [ ! -f _site/sitemap.xml ]; then
            echo "sitemap.xml missing"; exit 1
          fi
          count=$(grep -c "<url>" _site/sitemap.xml || true)
          echo "Sitemap has $count <url> entries"
          if [ "$count" -lt 3 ]; then
            echo "sitemap has fewer than 3 entries"; exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
