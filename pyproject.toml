# Tool configuration only — the app is not packaged.

[tool.pytest.ini_options]
# The repository root on sys.path, so `import contaautonomo` and `import modules`
# work however pytest is started (`pytest` or `python -m pytest`).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "instance", "backups", "logs"]

[tool.ruff.lint]
# Logging: lazy %-arguments, never f-strings or .format in a log call (G),
# and .exception() in an except block so the traceback is kept (LOG, TRY400).
extend-select = ["G", "LOG", "TRY400"]
# Start small (task E-1): pyflakes plus the pycodestyle error classes that
# catch real bugs. Tighten in later pull requests, one rule family at a time.
select = ["E4", "E7", "E9", "F"]
# E741 (variable named l / O / I) is style only.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# These files configure logging / the environment before importing the rest
# on purpose (baseline; revisit when app.py is split, task E-3).
"contaautonomo/web.py" = ["E402"]
"contaautonomo/security/auth_routes.py" = ["E402"]
"contaautonomo/core/module_manager.py" = ["E402"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
skip_empty = true
