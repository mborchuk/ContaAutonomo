title: "ContaAutónomo"
description: "Self-hosted accounting for Spanish freelancers (Autónomos) — Flask, modular, Docker-ready."
url: "https://mborchuk.github.io"
baseurl: "/ContaAutonomo"
lang: en
permalink: /:slug/

source: .
destination: ../_site

# Ensure runtime fetch of demo_data.json (copied into assets/data at CI time)
# is not stripped by Jekyll's default underscore/dotfile rules.
include:
  - "assets/data"

exclude:
  - vendor/
  - .bundle/
  - tools/
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO defaults
twitter:
  card: summary_large_image

social:
  links:
    - "https://github.com/mborchuk/ContaAutonomo"
