# Module catalog — source of truth for the Features page.
#
# Schema:
#   id           snake_case identifier (matches modules/<id>/index.py)
#   name         human-friendly title
#   status       "core" (foundational) or "optional" (toggleable in Settings)
#   description  short summary, max 150 characters
#   endpoints    list of HTTP routes ("VERB  /path") registered by the module
#   models       SQLAlchemy model class names registered by the module
#   features     bullet list of user-facing capabilities (>= 3 items)

- id: expenses
  name: "Expenses"
  status: core
  description: "Track expenses with file uploads, contractor links, multi-currency support and category filtering"
  endpoints:
    - "GET   /expenses/"
    - "GET   /expenses/create"
    - "POST  /expenses/create"
    - "GET   /expenses/edit/<id>"
    - "POST  /expenses/edit/<id>"
    - "POST  /expenses/delete/<id>"
    - "GET   /expenses/file/<filename>"
    - "GET   /expenses/download/<id>"
    - "GET   /expenses/preview/<id>"
  models:
    - "Expense"
    - "Contractor"
  features:
    - "Multi-currency expense entries with per-row exchange rate"
    - "Receipt attachments via FileStorageBackend (local, S3, GCS, GDrive)"
    - "Contractor relationships and category-based search"
    - "Quarterly grouping aligned with quarterly tax reporting"
    - "Contributes Expenses and VAT data to the Tax Obligations panel"

- id: tax_management
  name: "Tax Management"
  status: core
  description: "Manage Spanish tax forms (Modelo 349, 303, 130, 390, 100) and Social Security (autonomo) payments"
  endpoints:
    - "GET   /tax-forms/"
    - "POST  /tax-forms/upload"
    - "GET   /tax-forms/download/<id>"
    - "GET   /tax-forms/preview/<id>"
    - "POST  /tax-forms/delete/<id>"
    - "POST  /tax-forms/ss-payments/add"
    - "POST  /tax-forms/ss-payments/<id>/edit"
    - "POST  /tax-forms/ss-payments/<id>/delete"
  models:
    - "TaxForm"
    - "SSPayment"
  features:
    - "Upload and version Spanish Modelo PDFs (303, 130, 349, 390, 100)"
    - "Track Social Security (cuota autonomos) payments per month"
    - "Dashboard panel with annual SS totals and pending months"
    - "Quarterly grouping that mirrors AEAT submission deadlines"
    - "Inline preview and download for archived returns"

- id: tax_poland
  name: "Tax Poland (IT)"
  status: optional
  description: "Polish tax rules for IT freelancers (JDG/B2B): flat 19% PIT or progressive 12%/32%, VAT 23%, ZUS"
  endpoints: []
  models:
    - "TaxPolandConfig"
  features:
    - "Flat tax (19%) or progressive (12%/32%) PIT calculation"
    - "Health insurance: 4.9% on flat tax, 9% on progressive"
    - "Automatic VAT 23% (PTU) override on enable"
    - "Monthly ZUS social insurance with annual aggregation"
    - "Localized field labels (NIP, PESEL) for Polish freelancers"

- id: documents
  name: "Documents"
  status: core
  description: "Store and manage documents with categories, tags, multi-file attachments, preview and download"
  endpoints:
    - "GET   /documents/"
    - "GET   /documents/create"
    - "POST  /documents/create"
    - "GET   /documents/edit/<id>"
    - "POST  /documents/edit/<id>"
    - "GET   /documents/view/<id>"
    - "POST  /documents/delete/<id>"
    - "GET   /documents/download/<id>"
    - "GET   /documents/preview/<id>"
    - "GET   /documents/file/<file_id>/download"
    - "GET   /documents/file/<file_id>/preview"
    - "POST  /documents/file/<file_id>/delete"
    - "POST  /documents/file/<file_id>/sign/<cap_index>"
    - "GET   /documents/categories"
    - "POST  /documents/categories/add"
    - "POST  /documents/categories/<id>/delete"
    - "POST  /documents/categories/<id>/color"
    - "POST  /documents/duplicate/<id>"
    - "POST  /documents/bulk"
    - "POST  /documents/note/add/<doc_id>"
    - "POST  /documents/note/edit/<note_id>"
    - "POST  /documents/note/delete/<note_id>"
  models:
    - "Document"
    - "DocumentCategory"
    - "DocumentFile"
    - "DocumentConfig"
    - "DocumentHistory"
    - "DocumentNote"
  features:
    - "Multiple file attachments per document with size and format"
    - "Categories with custom colours and tag-based filtering"
    - "Per-document notes plus full audit history of changes"
    - "Inline preview, download and bulk operations"
    - "Auto-collected categories merged with manually managed ones"

- id: backup
  name: "Backup & Restore"
  status: core
  description: "Full encrypted backups (DB JSON + uploaded files) with daily scheduling and external storage"
  endpoints:
    - "POST  /backup/"
    - "GET   /backup/download/<filename>"
    - "POST  /backup/restore/<filename>"
    - "POST  /backup/delete/<filename>"
    - "GET   /backup/upload-restore"
    - "POST  /backup/upload-restore"
    - "POST  /backup/load-demo"
  models:
    - "BackupConfig"
  features:
    - "Single ZIP archive with DB dump and all uploaded files"
    - "Optional AES-256 encryption (app password or separate password)"
    - "Daily scheduled backups via TaskScheduler"
    - "Optional copy to External Storage (S3, GCS, Google Drive)"
    - "Restore from local backup, uploaded JSON, or demo dataset"

- id: reports
  name: "Reports"
  status: core
  description: "Generate professional financial reports (PDF) with selectable sections from any enabled module"
  endpoints:
    - "GET   /reports/"
    - "POST  /reports/generate"
    - "POST  /reports/file-list"
  models: []
  features:
    - "Quarterly or full-year reports for income, expenses and SS"
    - "Pluggable sections via get_report_sections() from any module"
    - "Currency mode: original or converted to base currency"
    - "Optional ZIP bundle with attached source documents"
    - "Configurable PDF report templates (official, minimal, custom)"

- id: external_storage
  name: "External Storage"
  status: optional
  description: "Route file storage to external backends: AWS S3, Google Cloud Storage or Google Drive"
  endpoints:
    - "POST  /storage/test"
  models:
    - "StorageConfig"
  features:
    - "Pluggable FileStorageBackend implementations"
    - "AWS S3 with profile, key-pair or default credentials"
    - "Google Cloud Storage and Google Drive with service accounts"
    - "Connection test directly from the settings UI"
    - "Transparent to other modules; uses core.storage API"

- id: invoice_attachments
  name: "Invoice Attachments"
  status: optional
  description: "Upload ready-made invoice PDFs from the invoice view, create or edit forms instead of generating them"
  endpoints:
    - "POST  /invoice-attachments/attach/<invoice_id>"
  models: []
  features:
    - "Attach an external PDF to any unlocked invoice"
    - "PDF upload field added to invoice create and edit forms"
    - "MIME validation and full audit logging on each upload"
    - "Replaces a generated PDF when one already exists"

- id: pdf_signature
  name: "PDF Signature"
  status: optional
  description: "Visual (image overlay) and digital (X.509/PFX) signing of invoice PDFs via pluggable capabilities"
  endpoints:
    - "POST  /pdf-signature/upload-file"
    - "GET   /pdf-signature/preview-signature"
    - "POST  /pdf-signature/sign/<invoice_id>"
  models:
    - "PDFSignatureConfig"
    - "PDFSignatureInvoice"
  features:
    - "Visual signature overlay with configurable position and size"
    - "Digital signing with X.509 PFX certificates via pyHanko"
    - "Capability provider for cross-module pdf_sign calls"
    - "Auto-detects pre-signed PDFs and badges them in the UI"

- id: pdf_verify
  name: "PDF Signature Verify"
  status: optional
  description: "Detect digital signatures in uploaded PDFs and display signer info (DocuSign, Adobe Sign, generic)"
  endpoints:
    - "POST  /pdf-verify/check"
    - "GET   /pdf-verify/details"
  models: []
  features:
    - "Extract X.509 signer details from embedded PKCS#7 signatures"
    - "Inline Signed badges injected into file lists across modules"
    - "Full certificate chain with validity dates per signer"
    - "Capability provider for pdf_verify and file_badge integrations"

- id: invoice_comments
  name: "Invoice Comments"
  status: optional
  description: "Add internal comments to invoices for tracking notes, reminders and communication history"
  endpoints:
    - "POST  /invoice-comments/add/<invoice_id>"
    - "POST  /invoice-comments/delete/<comment_id>"
  models:
    - "InvoiceComment"
  features:
    - "Comments are internal only and never appear on the PDF"
    - "Inline comments panel on the invoice view page"
    - "Initial-comment field injected into create and edit forms"
    - "Timestamped per comment with single-click delete"

- id: invoice_designer
  name: "Invoice Designer"
  status: optional
  description: "Visual UI for custom invoice PDF templates with block positioning, colours, fonts and label overrides"
  endpoints:
    - "GET   /invoice-designer/"
    - "GET   /invoice-designer/create"
    - "POST  /invoice-designer/create"
    - "GET   /invoice-designer/edit/<id>"
    - "POST  /invoice-designer/edit/<id>"
    - "POST  /invoice-designer/delete/<id>"
    - "POST  /invoice-designer/duplicate/<id>"
    - "GET   /invoice-designer/preview/<id>"
    - "POST  /invoice-designer/import"
    - "GET   /invoice-designer/export/<id>"
  models:
    - "InvoiceTemplate"
  features:
    - "Grid layout with top, header, subtotal, bottom and footer slots"
    - "Per-block colours, fonts, label overrides and offsets"
    - "Six layout presets plus a live PDF preview"
    - "Import and export templates as JSON"
    - "Multiple templates selectable from invoice settings"

- id: ai_parser
  name: "AI Document Parser"
  status: optional
  description: "AI-powered parsing of invoices and expenses (OpenAI GPT-4o, Anthropic Claude, Google Document AI)"
  endpoints:
    - "GET   /ai-parser/"
    - "POST  /ai-parser/parse"
  models:
    - "AIParserConfig"
  features:
    - "Pluggable providers: OpenAI, Anthropic, Google Document AI"
    - "Auto-fills invoice and expense forms from parsed JSON"
    - "Per-provider credentials stored in settings"
    - "Supports PDF, JPEG and PNG document uploads"
    - "Activity log entry for every parse attempt"

- id: auth_oauth
  name: "OAuth Authentication"
  status: optional
  description: "Pluggable OAuth provider (Google, GitHub) registered through BaseModule.get_auth_providers hook"
  endpoints:
    - "GET   /auth/oauth/login/<provider>"
    - "GET   /auth/oauth/callback/<provider>"
  models:
    - "OAuthAccount"
  features:
    - "Implements the AuthProvider interface from core auth_routes"
    - "Multiple providers can be enabled simultaneously"
    - "Account linking with existing local users"
    - "Stateless and removable without affecting core auth"
